name: Launch readiness

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: launch-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Install checksum-pinned Gitleaks
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan repository history for secrets
        run: /tmp/gitleaks git --config .gitleaks.toml --redact --exit-code 1 .

  application:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: drapixai_launch_gate
          POSTGRES_USER: drapixai_gate
          POSTGRES_PASSWORD: ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drapixai_gate -d drapixai_launch_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
      - name: Install API dependencies
        run: npm --prefix apps/api ci
      - name: Install web dependencies
        run: npm --prefix apps/web ci
      - name: Launch contract tests
        run: npm --prefix apps/api run test:launch
      - name: Shopify foundation tests
        run: npm --prefix apps/api run test:shopify
      - name: Authorization and storefront token tests
        run: |
          npm --prefix apps/api run test:authorization
          npm --prefix apps/api run test:storefront-tokens
          npm --prefix apps/api run test:cors-origin-cache
          npm --prefix apps/api run test:image-upload-security
          npm --prefix apps/api run test:async-errors
      - name: Distributed security controls
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: npm --prefix apps/api run test:distributed-security
      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://drapixai_gate:ci-disposable-only@127.0.0.1:5432/drapixai_launch_gate
        run: npm --prefix apps/api exec prisma validate -- --schema apps/api/prisma/schema.prisma
      - name: Apply migrations to disposable PostgreSQL
        env:
          DATABASE_URL: postgresql://drapixai_gate:ci-disposable-only@127.0.0.1:5432/drapixai_launch_gate
        run: npm --prefix apps/api run prisma:migrate:deploy
      - name: Verify immutable audit database triggers
        env:
          DATABASE_URL: postgresql://drapixai_gate:ci-disposable-only@127.0.0.1:5432/drapixai_launch_gate
        run: npm --prefix apps/api run test:audit-immutability
      - name: Validate hardened Compose manifests
        run: |
          set -euo pipefail
          cp deploy/env/api.production.example deploy/env/api.production.env
          cp deploy/env/web.production.example deploy/env/web.production.env
          cp deploy/env/ai.production.example deploy/env/ai.production.env
          trap 'rm -f deploy/env/api.production.env deploy/env/web.production.env deploy/env/ai.production.env' EXIT
          docker compose --env-file deploy/env/api.production.example -f deploy/docker-compose.edge.yml config --quiet
          docker compose --env-file deploy/env/ai.production.example -f deploy/docker-compose.ai.yml config --quiet
      - name: Validate launch gate tooling and production CSP
        run: |
          node --check scripts/launch-gate-report.mjs
          node -e "JSON.parse(require('node:fs').readFileSync('deploy/launch-gates.json', 'utf8'))"
          node scripts/verify-production-csp.mjs
      - name: API production build
        run: npm --prefix apps/api run build
      - name: Web production build
        run: npm --prefix apps/web run build
      - name: Production dependency audit
        run: |
          npm --prefix apps/api audit --omit=dev --audit-level=high
          npm --prefix apps/web audit --omit=dev --audit-level=high

  ai-contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU validation dependencies
        run: >-
          python -m pip install
          pip-audit==2.9.0
          pillow==12.3.0
          numpy==1.26.4
          opencv-python-headless==4.10.0.84
          scipy==1.13.1
          scikit-image==0.24.0
      - name: Audit secure AI candidate pins
        run: >-
          pip-audit
          --requirement drapixai_ai/requirements.security-candidate.txt
          --progress-spinner off
          --ignore-vuln PYSEC-2026-2274
          --ignore-vuln GHSA-55v6-g8pm-pw4c
          --ignore-vuln PYSEC-2026-3447
          --ignore-vuln GHSA-rrmf-rvhw-rf47
      - name: Compile production Python
        run: |
          python -m compileall -q drapixai_ai deploy/runpod
      - name: AI ingress security regression
        run: python -m drapixai_ai.scripts.validate_ai_ingress_security
      - name: Validate transient image spool
        run: python -m drapixai_ai.scripts.validate_transient_spool
      - name: CPU quality regressions
        run: |
          python -m drapixai_ai.scripts.validate_garment_skin_detection
          python -m drapixai_ai.scripts.validate_tryon_scorer_neutral_garments
          python deploy/runpod/validate_upper_body_50_tooling.py
      - name: Deployment shell syntax
        run: |
          find deploy -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

  container-scan:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build production edge images
        run: |
          docker build -f apps/api/Dockerfile -t "drapixai-api:${GITHUB_SHA}" .
          docker build -f apps/web/Dockerfile -t "drapixai-web:${GITHUB_SHA}" .
      - name: Scan production edge images
        run: >-
          bash deploy/scripts/scan-container-images.sh
          "drapixai-api:${GITHUB_SHA}"
          "drapixai-web:${GITHUB_SHA}"
