upstream drapixai_web {
    server web:3000;
}

upstream drapixai_api {
    server api:8000;
}

server_tokens off;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:DRAPIXAI_SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
client_header_timeout 15s;
client_body_timeout 30s;
send_timeout 60s;

server {
    listen 8080 default_server;
    server_name _;
    return 444;
}

server {
    listen 8080;
    server_name drapixai.com www.drapixai.com api.drapixai.com;
    client_max_body_size 20m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl default_server;
    http2 on;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name drapixai.com www.drapixai.com;
    client_max_body_size 20m;

    ssl_certificate /etc/letsencrypt/live/drapixai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drapixai.com/privkey.pem;

    location / {
        proxy_pass http://drapixai_web;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name api.drapixai.com;
    client_max_body_size 20m;

    ssl_certificate /etc/letsencrypt/live/drapixai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drapixai.com/privkey.pem;

    location / {
        proxy_pass http://drapixai_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
