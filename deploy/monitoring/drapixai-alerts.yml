groups:
  - name: drapixai-email
    rules:
      - alert: DrapixAIEmailSendFailures
        expr: sum(increase(drapixai_email_send_total{outcome=~"failed|unknown"}[10m])) > 3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: DrapixAI transactional email needs investigation
          description: More than three attempts failed or have uncertain SMTP acceptance. Reconcile before retrying.
      - alert: DrapixAIEmailComplaint
        expr: drapixai_email_complaints_recent > 0
        labels:
          severity: warning
        annotations:
          summary: DrapixAI email complaint received
          description: Review delivery metadata and suppression using restricted operator access; do not resend automatically.
      - alert: DrapixAIEmailBounceSpike
        expr: drapixai_email_failures_recent > 3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: DrapixAI email delivery failures increased
          description: Review provider failures, sender configuration and recipient suppression.
      - alert: DrapixAIEmailRetentionBacklog
        expr: drapixai_email_retention_overdue > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: DrapixAI email callback retention needs attention
          description: Callback metadata exceeded its retention threshold. Check the bounded cleanup job and database access.
  - name: drapixai-security
    rules:
      - alert: DrapixAIAuthenticationFailureSpike
        expr: sum(rate(drapixai_auth_failures_total[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Elevated DrapixAI authentication failures
          description: Authentication or authorization failures exceeded 30 per minute for five minutes.

      - alert: DrapixAIRateLimitSpike
        expr: sum(rate(drapixai_rate_limited_total[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Abnormal DrapixAI request volume
          description: Application rate-limit rejections exceeded 60 per minute for five minutes.

  - name: drapixai-capacity
    rules:
      - alert: DrapixAITryOnOutcomeUnconfirmed
        expr: drapixai_tryon_uncertain_work > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: DrapixAI work requires terminal-state reconciliation
          description: Capacity remains held after an uncertain AI outcome. Pause affected intake and verify the actual job state before scoped reconciliation.
      - alert: DrapixAITryOnIntakePaused
        expr: drapixai_tryon_intake_enabled == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: DrapixAI try-on intake is paused
          description: New shopper try-ons are being rejected. Confirm this is an approved maintenance or incident action.

      - alert: DrapixAIGpuQueueGrowing
        expr: drapixai_gpu_queue_depth > 10
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: DrapixAI GPU queue is growing
          description: More than ten jobs have remained queued for three minutes.

      - alert: DrapixAIGpuQueueCritical
        expr: drapixai_gpu_queue_depth > 30
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: DrapixAI GPU queue is critically backed up
          description: Protect latency by pausing intake or adding a worker.

  - name: drapixai-webhooks
    rules:
      - alert: DrapixAIWebhookDeliveryFailures
        expr: increase(drapixai_webhook_failures_total[15m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: DrapixAI webhook delivery failures
          description: More than five webhook attempts failed in fifteen minutes.

      - alert: DrapixAIFailedWebhookBacklog
        expr: drapixai_webhook_failed > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Permanently failed DrapixAI webhooks need review
          description: At least one webhook exhausted all delivery attempts.
