services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - ./env/api.production.env
    command: ["sh", "-c", "exec redis-server --save '' --appendonly no --requirepass \"$$DRAPIXAI_REDIS_PASSWORD\""]
    read_only: true
    tmpfs:
      - /data:size=256m,mode=0700
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ./env/api.production.env
    environment:
      REDIS_URL: redis://default:${DRAPIXAI_REDIS_PASSWORD:?set DRAPIXAI_REDIS_PASSWORD}@redis:6379
    volumes:
      - ${DRAPIXAI_INTERNAL_TLS_SECRETS_DIR:?set DRAPIXAI_INTERNAL_TLS_SECRETS_DIR}/drapixai-internal-ca.pem:/run/secrets/drapixai-internal-ca.pem:ro
      - ${DRAPIXAI_INTERNAL_TLS_SECRETS_DIR:?set DRAPIXAI_INTERNAL_TLS_SECRETS_DIR}/drapixai-ai-client.crt:/run/secrets/drapixai-ai-client.crt:ro
      - ${DRAPIXAI_INTERNAL_TLS_SECRETS_DIR:?set DRAPIXAI_INTERNAL_TLS_SECRETS_DIR}/drapixai-ai-client.key:/run/secrets/drapixai-ai-client.key:ro
    depends_on:
      - redis
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/apps/api/uploads:size=256m,mode=0700,uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - frontend
      - backend

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file:
      - ./env/web.production.env
    depends_on:
      - api
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/apps/web/.next/cache:size=128m,mode=0700,uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - frontend

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./nginx/drapixai.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=64m,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - frontend

networks:
  frontend:
  backend:
    internal: true
