services:
  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    env_file:
      - ./env/ai.production.env
    command: ["sh", "-c", "exec redis-server --save '' --appendonly no --requirepass \"$$DRAPIXAI_REDIS_PASSWORD\""]
    tmpfs:
      - /data:size=256m,mode=0700
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    networks:
      - ai-private

  ai-api:
    image: ${DRAPIXAI_AI_RELEASE_IMAGE:?set DRAPIXAI_AI_RELEASE_IMAGE}
    restart: unless-stopped
    env_file:
      - ./env/ai.production.env
      - ./release/standard-catvton-rc1.env
    environment:
      DRAPIXAI_REDIS_URL: redis://default:${DRAPIXAI_REDIS_PASSWORD:?set DRAPIXAI_REDIS_PASSWORD}@redis:6379/0
    command: ["bash", "/workspace/drapixai/deploy/runpod/start-ai-api.sh"]
    depends_on:
      - redis
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../models:/workspace/drapixai/models:ro
      - ai_runtime:/workspace/drapixai/runtime
      - ai_hf_cache:/workspace/.cache/huggingface
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    shm_size: 8gb
    networks:
      - ai-private
    gpus: all

  ai-worker:
    image: ${DRAPIXAI_AI_RELEASE_IMAGE:?set DRAPIXAI_AI_RELEASE_IMAGE}
    restart: unless-stopped
    env_file:
      - ./env/ai.production.env
      - ./release/standard-catvton-rc1.env
    environment:
      DRAPIXAI_REDIS_URL: redis://default:${DRAPIXAI_REDIS_PASSWORD:?set DRAPIXAI_REDIS_PASSWORD}@redis:6379/0
      DRAPIXAI_WORKER_ROLE: upper
    command: ["bash", "/workspace/drapixai/deploy/runpod/start-ai-worker.sh"]
    depends_on:
      - redis
    volumes:
      - ../models:/workspace/drapixai/models:ro
      - ai_runtime:/workspace/drapixai/runtime
      - ai_hf_cache:/workspace/.cache/huggingface
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    shm_size: 8gb
    networks:
      - ai-private
    gpus: all

  ai-lower-worker:
    profiles: ["lower-body"]
    build:
      context: ..
      dockerfile: drapixai_ai/docker/Dockerfile.lower-body
      args:
        DRAPIXAI_AI_BASE_IMAGE: ${DRAPIXAI_AI_RUNTIME_IMAGE:?set DRAPIXAI_AI_RUNTIME_IMAGE}
    restart: unless-stopped
    env_file:
      - ./env/ai.production.env
      - ./release/standard-catvton-rc1.env
    environment:
      DRAPIXAI_REDIS_URL: redis://default:${DRAPIXAI_REDIS_PASSWORD:?set DRAPIXAI_REDIS_PASSWORD}@redis:6379/0
      DRAPIXAI_WORKER_ROLE: lower
      DRAPIXAI_LOWER_BODY_ENGINE: fashn_vton
    command: ["bash", "/workspace/drapixai/deploy/runpod/start-ai-worker.sh"]
    depends_on:
      - redis
    volumes:
      - ../models:/workspace/drapixai/models:ro
      - ai_runtime:/workspace/drapixai/runtime
      - ai_hf_cache:/workspace/.cache/huggingface
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    shm_size: 8gb
    networks:
      - ai-private
    gpus: all

volumes:
  ai_runtime:
  ai_hf_cache:

networks:
  ai-private:
    internal: true
