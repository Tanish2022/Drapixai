<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DrapixAI sharing card</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body { background: #fbfcf9; color: #172019; font-family: Arial, sans-serif; }
    main { height: 100%; padding: 42px 76px 36px; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .wordmark { width: 500px; height: 167px; object-fit: contain; mix-blend-mode: darken; }
    .rule { width: 72px; height: 2px; margin: 12px 0 28px; background: #31725b; }
    h1 { margin: 0; font: 64px/1.06 Georgia, 'Times New Roman', serif; letter-spacing: -1.3px; color: #101712; }
    p { margin: 24px 0 0; font-size: 22px; line-height: 1.4; color: #59645c; }
    footer { width: 100%; margin-top: auto; padding-top: 22px; border-top: 1px solid #d8dfd6; color: #183f32; font-size: 18px; }
  </style>
</head>
<body>
  <main>
    <img class="wordmark" src="{{WORDMARK_DATA_URL}}" alt="DrapixAI">
    <div class="rule" aria-hidden="true"></div>
    <h1>Virtual try-on for<br>fashion storefronts.</h1>
    <p>Start with one product. Review every result.</p>
    <footer>drapixai.com</footer>
  </main>
</body>
</html>
